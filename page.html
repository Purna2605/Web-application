<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purna Shoes - Your Perfect Pair</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px 0;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header nav ul {
      list-style-type: none;
      padding: 0;
      margin-top: 10px;
    }

    header nav ul li {
      display: inline;
      margin: 0 15px;
    }

    header nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    header nav ul li a:hover {
      text-decoration: underline;
    }

    /* Main Content */
    .hero {
      background: url('https://via.placeholder.com/1200x500') center/cover no-repeat;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      font-size: 2rem;
    }

    .hero h2 {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
    }

    .product-section {
      padding: 50px 20px;
      text-align: center;
    }

    .product-section h2 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
      justify-items: center;
    }

    .product-card {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 250px;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .product-card h3 {
      margin: 15px 0;
      font-size: 22px;
    }

    .product-card p {
      color: #333;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .product-card button {
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .product-card button:hover {
      background-color: #45a049;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }

    footer p {
      margin: 0;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>Purna Shoes</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <div class="hero">
    <h2>Find Your Perfect Pair of Shoes</h2>
  </div>

  <!-- Product Section -->
  <div class="product-section">
    <h2>Featured Shoes</h2>
    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x250" alt="Shoes">
        <h3>Stylish Sneakers</h3>
        <p>$49.99</p>
        <button>Add to Cart</button>
      </div>
      <!-- Product 2 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x250" alt="Shoes">
        <h3>Classic Leather Boots</h3>
        <p>INR 7000</p>
        <button>Add to Cart</button>
      </div>
      <!-- Product 3 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x250" alt="Shoes">
        <h3>Running Shoes</h3>
        <p>INR 3000</p>
        <button>Add to Cart</button>
      </div>
      <!-- Product 4 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/250x250" alt="Shoes">
        <h3>Summer Sandals</h3>
        <p>INR 30000</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Footer Section -->
  <footer>
    <p>&copy; 2025 Purna Shoes | All Rights Reserved</p>
  </footer>

</body>
</html>
